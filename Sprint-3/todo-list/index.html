<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <script type="module" src="script.mjs"></script>
  </head>
  <body>
    <div class="todo-container">
      <h1>My ToDo List</h1>

      <div class="todo-input">
        <label for="new-task-input" class="visually-hidden">Task</label>
        <input
          type="text"
          id="new-task-input"
          placeholder="Enter a new task..."
        />
        <label for="new-task-deadline" class="visually-hidden"
          >Deadline (optional)</label
        >
        <input type="date" id="new-task-deadline" />
        <button id="add-task-btn">Add</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <button id="delete-completed-btn">Delete completed tasks</button>

      <template id="todo-item-template">
        <li class="todo-item">
          <span class="description">Task description</span>
          <span class="deadline"></span>
          <div class="actions">
            <button class="complete-btn">
              <span class="fa-solid fa-check" aria-hidden="true"></span>
            </button>
            <button class="delete-btn">
              <span class="fa-solid fa-trash" aria-hidden="true"></span>
            </button>
          </div>
        </li>
      </template>
    </div>
  </body>
</html>
